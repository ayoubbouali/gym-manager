# Production: PostgreSQL + application + Caddy (HTTPS behind Cloudflare). See README, section 3 bis.
#   docker compose -f docker/docker-compose.prod.yaml up -d --build
# Requires docker/.env (DB_PASSWORD, APP_DOMAIN) and the Cloudflare origin certificate in docker/certs/.
# Only Caddy publishes a port: PostgreSQL and the application stay on the internal network.

name: gymmanager-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
    volumes:
      - gym-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gym -d gym" ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gymmanager/gym-manager:prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gym
      DB_USER: gym
      DB_PASSWORD: ${DB_PASSWORD}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Trust X-Forwarded-For / X-Forwarded-Proto from Caddy: real client IP for the password reset rate limit,
      # and secure session cookie.
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - gym-files:/data   # uploaded photos and logo

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set in docker/.env}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gym-db:
  gym-files:
  caddy-data:
  caddy-config:
