# Whole application (PostgreSQL + API + Angular UI), from the repository root:
#   docker compose -f docker/docker-compose.yaml up -d --build
#   -> http://localhost:8090  (admin / admin123, password change asked at first login)
# Database only, for local development (mvn -pl gym-manager-backend spring-boot:run):
#   docker compose -f docker/docker-compose.yaml up -d db

name: gymmanager

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gym}
    ports:
      - "${DB_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - gym-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gym -d gym" ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gymmanager/gym-manager:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gym
      DB_USER: gym
      DB_PASSWORD: ${DB_PASSWORD:-gym}
      # Brevo HTTP API for password reset emails (see README, section 4 bis)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${APP_PORT:-8090}:8090"
    volumes:
      - gym-files:/data   # uploaded photos and logo

volumes:
  gym-db:
  gym-files:
